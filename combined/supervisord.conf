; Runs gunicorn (Django/ml-backend) and node (gateway) as two supervised
; processes in one container, so gateway can reach Django over localhost
; instead of a cross-service network call. gunicorn binds 127.0.0.1 only
; (see [program:gunicorn] below) and is never reachable from outside this
; container; node is the sole public listener.
[supervisord]
nodaemon=true
; No non-root user exists in this image (matches ml-backend/Dockerfile and
; gateway/Dockerfile, neither of which create one either) — this silences
; supervisord's own CRIT-level "running as root" startup notice, which
; otherwise reads like a real problem in production logs but is actually
; just supervisord confirming intended behavior.
user=root

; --preload forks workers only after predictor/apps.py's ready() hook has
; already eagerly loaded both dataset caches in the master process (see
; ml-backend/predictor/apps.py) — kept identical to ml-backend/Dockerfile's
; CMD, only the bind address changes (127.0.0.1 instead of 0.0.0.0).
[program:gunicorn]
directory=/app/ml-backend
command=gunicorn amr_project.wsgi:application --bind 127.0.0.1:8000 --preload --timeout 120 --workers 1 --threads 8 --worker-class gthread
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; directory=/app/gateway matters beyond cwd convention here: gateway/.env's
; FIREBASE_SERVICE_ACCOUNT_PATH (./firebase-service-account.json) resolves
; relative to process.cwd(), and dotenv's config() in gateway/index.js looks
; for a .env file relative to cwd too (a no-op here since env vars are
; already injected into the container's environment, but still the correct
; cwd to match the standalone gateway service's behavior).
[program:node]
directory=/app/gateway
command=node index.js
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
