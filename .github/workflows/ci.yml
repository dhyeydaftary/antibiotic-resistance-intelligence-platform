name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    env:
      # Dummy, CI-only values — nothing here talks to a real service.
      # gateway/tests/helpers.js points FIREBASE_SERVICE_ACCOUNT_PATH at a
      # committed fake fixture itself, so it isn't set here.
      JWT_SECRET: ci-dummy-jwt-secret-for-tests
      RESEND_API_KEY: re_dummy_ci_key
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - run: npm ci
      - run: npm test

  ml-backend:
    name: ML backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-backend
    env:
      # Dummy, CI-only values — SQLite is used by default, so no external
      # database is needed.
      SECRET_KEY: ci-dummy-secret-key
      DEBUG: 'False'
      ALLOWED_HOSTS: 127.0.0.1,localhost
      INTERNAL_API_KEY: ci-dummy-internal-api-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-backend/requirements.txt

      - run: pip install -r requirements.txt
      - run: python manage.py test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Dummy Firebase web config — public identifiers, not secrets, but
      # the build needs something set. VITE_GATEWAY_URL is left unset; it
      # has a working default.
      VITE_FIREBASE_API_KEY: ci-dummy-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-dummy-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:ci0000000000000000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
