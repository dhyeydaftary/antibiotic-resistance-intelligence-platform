name: Publish Docker Image

# Runs only when a GitHub Release is published (not on every push) — a
# published image should correspond to a real, tagged version someone can
# pull with confidence, not every intermediate commit.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and push combined image
    runs-on: ubuntu-latest
    # Required for pushing to GitHub Container Registry using the
    # automatically-provided GITHUB_TOKEN — no extra secret needed.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives clean, standard tags from the release: the exact version
      # (e.g. v1.1.0) and `latest`, so `docker pull ghcr.io/.../amr-insight`
      # with no tag always gets the most recent published release.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/amr-insight
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds from the repo root (context: .) using combined/Dockerfile,
      # matching exactly how Render builds and deploys this same image —
      # this workflow doesn't introduce a second, potentially-diverging
      # build definition.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: combined/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}