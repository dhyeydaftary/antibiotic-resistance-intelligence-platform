# SPA config: any path nginx can't match to a real static file falls back
# to index.html, so React Router's client-side routes (e.g. a refresh on
# /history) resolve instead of 404ing at the web server before React Router
# ever gets a chance to handle it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
